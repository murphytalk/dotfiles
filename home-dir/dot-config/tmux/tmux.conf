set-option -g default-shell /bin/fish
set-option -g default-terminal "screen-256color"

set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @sessionx-bind 'g'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-zoxide-mode 'on'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resize panes without prefix key (Alt + Arrow keys)
bind -n M-Left resize-pane -L 5    # Alt + Left: make current pane narrower
bind -n M-Right resize-pane -R 5   # Alt + Right: make current pane wider
bind -n M-Up resize-pane -U 5      # Alt + Up: shrink height (grow above)
bind -n M-Down resize-pane -D 5    # Alt + Down: shrink height (grow below)

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# https://github.com/badlogic/pi-mono/blob/main/packages/coding-agent/docs/tmux.md
set -g extended-keys on
set -g extended-keys-format csi-u

bind C-j display-popup \
  -d "#{pane_current_path}" \
  -w 80% -h 80% \
  -E "lazyjj"

set -g @continuum-restore 'on'
run '~/.config/tmux/plugins/tpm/tpm'
